<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meu Salário Japão"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Meu Salário Japão 🇯🇵</title></head><body><header><h1>Meu Salário Japão 🇯🇵</h1><p>Calculadora de salário, horas e adicionais</p></header><main><section class="card"><div class="grid"><label>Valor por hora (¥)<input id="hourly" type="number" inputmode="decimal" value="1230"></label><label>Horas normais<input id="normal" type="number" inputmode="decimal" value="160"></label><label>Horas extras<input id="overtime" type="number" inputmode="decimal" value="0"></label><label>Horas noturnas<input id="night" type="number" inputmode="decimal" value="0"></label><label>Dias noturnos<input id="nightDays" type="number" inputmode="decimal" value="0"></label></div><div class="results"><div><span>Salário normal</span><strong id="normalPay">¥0</strong></div><div><span>Hora extra (25%)</span><strong id="overtimePay">¥0</strong></div><div><span>Adicional noturno (25%)</span><strong id="nightPay">¥0</strong></div><div class="total"><span>Total estimado</span><strong id="totalPay">¥0</strong></div></div><button id="reset">Restaurar valores</button></section></main><footer>V3.4 • Seus dados ficam no aparelho</footer><script src="app.js"></script></body></html>
